name: Deploy

# Every merge to main deploys the Worker, with the built page as its static assets, to
# Cloudflare's free plan, with RTT's list of stations and timing points for the set-up form's
# search (fetched here, weekly as well, since the list changes). Its secrets are the `production`
# environment's, which only main may use, so a workflow on another branch can't read them
# (studio/producer-guide.md#one-time-setup); without them it says so and stops, rather than failing.
# Each secret goes only to the steps that use it. The repo is public and so are its logs: the
# site's address is masked in them.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly too, so the list of stations and timing points stays fresh.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_RTT: ${{ secrets.RTT_TOKEN != '' }}
        run: |
          echo "rtt=$HAS_RTT" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CF" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not deployed::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID aren't set yet. See studio/producer-guide.md#one-time-setup."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Fetch the list of stations and timing points for the search
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.rtt == 'true'
        env:
          RTT_TOKEN: ${{ secrets.RTT_TOKEN }}
        run: node .github/scripts/places.mjs web/public/places.json
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm --filter @too-too-soon/web build

      - name: Deploy the Worker and the page
        if: steps.ready.outputs.ok == 'true'
        id: deploy
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Into a file first, so the address is masked before wrangler's output reaches the log.
        run: |
          status=0
          pnpm exec wrangler deploy > deploy.log 2>&1 || status=$?
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -n "$url" ]; then
            host=${url#https://}
            echo "::add-mask::$url"
            echo "::add-mask::$host"
            sub=${host%.workers.dev}
            echo "::add-mask::${sub#*.}"
          fi
          cat deploy.log
          [ "$status" -eq 0 ] || exit "$status"
          if [ -z "$url" ]; then
            echo "::warning title=No workers.dev address::Deployed, but wrangler didn't print a workers.dev address. Has the account chosen its workers.dev subdomain? See studio/producer-guide.md#one-time-setup."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # From the secret store to the Worker's, through stdin: never echoed, never in a file.
      - name: Give the Worker the Realtime Trains token
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.rtt == 'true'
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RTT_TOKEN: ${{ secrets.RTT_TOKEN }}
        run: printf '%s' "$RTT_TOKEN" | pnpm exec wrangler secret put RTT_TOKEN

      - name: Say where it is, and what the token may do
        if: steps.ready.outputs.ok == 'true'
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          HAS_RTT: ${{ steps.ready.outputs.rtt }}
        run: node .github/scripts/summary.mjs
