name: Probe

# Asks the live Worker what it sees, from GitHub's runners (sessions can't always reach
# workers.dev): /api/info, then /api/next for a spot. Run it by hand, from the Actions tab or a session.
# Give `place` (a Google Maps link, short or long, or "lat,lon") to find the spot's timing points
# from OpenStreetMap the way the map picker does, instead of a and b. Give `sample` (a location
# code) to see what RTT itself sends there, fields and all, using the RTT_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      place:
        description: A map link or "lat,lon" (overrides a, b and f)
        default: ""
      a:
        description: Timing point A (TIPLOC or station code)
        default: CLJ
      b:
        description: Timing point B (TIPLOC or station code)
        default: EAD
      f:
        description: How far from A to B, 0 to 1
        default: "0.5"
      sample:
        description: A location code (or a /data/ path, or \"places\" for the search list) to show what RTT itself sends (uses the RTT_TOKEN secret), instead of probing the site
        default: ""
      url:
        description: The site
        default: https://too-too-soon.justin-fc2.workers.dev

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: inputs.sample == ''
        run: node .github/scripts/probe.mjs
        env:
          PLACE: ${{ inputs.place }}
          A: ${{ inputs.a }}
          B: ${{ inputs.b }}
          F: ${{ inputs.f }}
          SITE: ${{ inputs.url }}
      - if: inputs.sample != '' && inputs.sample != 'places'
        run: node .github/scripts/rtt-sample.mjs
        env:
          SAMPLE: ${{ inputs.sample }}
          RTT_TOKEN: ${{ secrets.RTT_TOKEN }}
      # `places`: build the set-up form's place list as the deploy does, and try a few searches.
      - if: inputs.sample == 'places'
        env:
          RTT_TOKEN: ${{ secrets.RTT_TOKEN }}
        run: |
          node .github/scripts/places.mjs /tmp/places.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { searchPlaces } from "./packages/core/src/places.ts";
            const p = JSON.parse(readFileSync("/tmp/places.json", "utf8"));
            for (const q of ["wok", "brookwood", "clapham j", "st albans", "WOKINGJ", "basingstoke"]) console.log(q, "→", searchPlaces(p, q, 6).map((x) => `${x.name} (${x.code}${x.station ? "" : ", timing point"})`).join("; "));
          '
          gzip -c /tmp/places.json | wc -c | xargs -I{} echo "gzipped: {} bytes"
