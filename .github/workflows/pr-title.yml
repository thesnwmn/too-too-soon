name: PR title

# The PR title becomes the squash commit on main, so it's checked like code.
# The format is in studio/README.md#prs.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # Reads the title only; never checks out the PR's code, so pull_request_target is safe.
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            spike
            docs
            test
            refactor
            perf
            chore
            ci
          # Optional; one of the repo's areas. A PR that adds an area adds its scope.
          scopes: |
            core
            worker
            web
            studio
            health
            docs
          requireScope: false
          # Plain words starting with a capital (or a `code` name), no full stop.
          subjectPattern: ^(?![a-z]).+[^.]$
          subjectPatternError: |
            The summary "{subject}" should start with a capital letter and not end with a full stop,
            e.g. "feat(web): Big countdown to the next train". See studio/README.md#prs.
