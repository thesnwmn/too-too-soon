name: Demo on Pages

# The page in demo mode (recorded trains, no Worker) on GitHub Pages, so it can be tried before
# the accounts exist. Needs Pages set to "GitHub Actions" (studio/producer-guide.md#one-time-setup);
# until then it says so and stops.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is on
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Demo not deployed::GitHub Pages isn't set to 'GitHub Actions' yet. See studio/producer-guide.md#one-time-setup."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm --filter @too-too-soon/web build
        env:
          VITE_DEMO: "1"
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - if: steps.ready.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
