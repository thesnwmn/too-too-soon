name: Demo on Pages

# The page in demo mode (recorded trains, no Worker) on GitHub Pages, so it can be tried before
# the accounts exist. Needs Pages set to "GitHub Actions" (studio/producer-guide.md#one-time-setup);
# until then it says so and stops.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check Pages is on
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>&1); then
            if [ "$build" = "workflow" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice title=Demo not deployed::GitHub Pages is on, but its source isn't 'GitHub Actions'. See studio/producer-guide.md#one-time-setup."
          elif echo "$build" | grep -q "404"; then
            echo "::notice title=Demo not deployed::GitHub Pages isn't switched on yet. See studio/producer-guide.md#one-time-setup."
          else
            echo "::warning title=Couldn't ask about Pages::$build"
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"

  pages:
    needs: ready
    if: needs.ready.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No token here for the deploy's place list and points: the demo's small sample instead (web/demo/README.md).
      - run: cp web/demo/places.json web/demo/points.json web/public/
      - run: pnpm --filter @too-too-soon/web build
        env:
          VITE_DEMO: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
